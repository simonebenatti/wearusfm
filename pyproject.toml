[project]
name = "wearusfm"
version = "0.1.0"
description = "Foundation model per sEMG - WearUsFM"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
gpu = [
    "torch",
]
test = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
